<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart Maps
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            Highcharts Maps
        </h2>
        <p>
            외부 요청 없이 인라인 GeoJSON을 등록하고 map·mapline·mappoint·mapbubble을 조합합니다.
        </p>
        <section class="demo-card">
            <syn_chart id="chtMap" class="demo-chart tall" syn-options="{ constructorType:'mapChart', selectionMode:'multiple', option:{} }" syn-events="['selectionChange']">
            </syn_chart>
            <pre id="preResult">
지역 또는 지점을 클릭하세요.
				</pre>
        </section>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
