<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>
        GoogleMap 선택 예제
    </title>
    <link rel="stylesheet" href="googlemapdemo.css" />
</head>
<body style="visibility: hidden;">
    <form id="form1">
        <div class="demo-card">
            <div class="demo-nav">
                <a href="index.html">
                    ← 예제 목록
                </a>
            </div>
            <h3>
                다중 선택과 Row/List 결과
            </h3>
            <syn_googlemap id="mapSelection" class="demo-map" syn-datafield="Offices" syn-events="['selectionChange','error']" syn-options="{selectionMode:'multiple',fitBoundsOnData:true,preserveSelection:true}">
            </syn_googlemap>
            <div class="demo-actions">
                <input type="button" id="btnSelect" value="서울·부산 선택" syn-events="['click']" />
                <input type="button" id="btnClear" value="선택 해제" syn-events="['click']" />
                <input type="button" id="btnRow" value="Row" syn-events="['click']" />
                <input type="button" id="btnList" value="List" syn-events="['click']" />
            </div>
            <pre id="preResult">여러 마커를 클릭하세요.</pre>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
