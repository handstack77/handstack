<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        ECharts Cartesian
    </title>
    <link rel="stylesheet" href="echartsdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            Cartesian series
        </h2>
        <p>
            객체 행을 원본으로 보관하면서 line, bar, scatter, effectScatter, pictorialBar, candlestick, boxplot 옵션을 그대로 렌더링합니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    Dataset 혼합 차트
                </h3>
                <syn_echarts id="chtCartesian" class="demo-chart tall" syn-events="['click','selectionChange']" syn-options="{ selectionMode:'multiple', option:{} }">
                </syn_echarts>
            </section>
            <section class="demo-card">
                <h3>
                    선택 결과
                </h3>
                <div class="demo-actions">
                    <input id="btnCartesianRow" type="button" value="Row" syn-events="['click']">
                    <input id="btnCartesianList" type="button" value="List" syn-events="['click']">
                </div>
                <pre id="preResult">

차트의 점을 선택하세요.
					
					</pre>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
