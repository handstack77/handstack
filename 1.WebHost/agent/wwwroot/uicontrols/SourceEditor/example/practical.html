<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>SourceEditor - 서비스 설정 편집 화면(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">시스템 관리 / 서비스 설정</div>
                                <h2 class="page-title">서비스 설정 편집</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnFormat" class="btn" syn-events="['click']"><i class="f:20 ti ti-align-left mr-2"></i> 서식 정리</button>
                                    <button type="button" id="btnValidate" class="btn" syn-events="['click']"><i class="f:20 ti ti-checks mr-2"></i> 검증</button>
                                    <button type="button" id="btnRevert" class="btn" syn-events="['click']"><i class="f:20 ti ti-arrow-back-up mr-2"></i> 되돌리기</button>
                                    <button type="button" id="btnSave" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-device-floppy mr-2"></i> 저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid max-width:1000!">
                        <div class="card overflow-auto mb-3">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">appsettings.json</h3>
                                <div class="card-actions">
                                    <span id="spnState" class="mr-2">변경 없음</span>
                                </div>
                            </div>
                            <div class="card-body p-2">
                                <syn_sourceeditor id="txtConfig" syn-datafield="ConfigText" syn-options="{language: 'json', theme: 'vs', height: '360px', controlText: '서비스 설정'}"></syn_sourceeditor>
                            </div>
                        </div>
                        <div class="card overflow-auto">
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">검증 / 저장 결과</h3>
                            </div>
                            <div class="card-body">
                                <pre id="preResult" class="mb-0" style="white-space: pre-wrap;">검증 또는 저장 버튼을 누르면 결과가 표시됩니다.</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
