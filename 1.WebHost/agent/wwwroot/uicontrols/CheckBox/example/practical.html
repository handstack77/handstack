<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>CheckBox - 약관 동의와 메뉴 권한 설정(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">시스템 관리 / 사용자 관리</div>
                                <h2 class="page-title">사용자 등록과 권한 설정</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnReset" class="btn" syn-events="['click']"><i class="f:20 ti ti-refresh mr-2"></i> 초기화</button>
                                    <button type="button" id="btnSave" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-device-floppy mr-2"></i> 저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid max-width:1000!">
                        <div class="card overflow-auto mb-3">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">약관 동의</h3>
                            </div>
                            <div class="card-body">
                                <div class="row mb-2">
                                    <div class="col">
                                        <input id="chkAgreeAll" type="checkbox" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '모든 약관에 동의합니다'}" syn-events="['change']">
                                    </div>
                                </div>
                                <hr class="my-2">
                                <div class="row mb-1">
                                    <div class="col">
                                        <input id="chkAgreeTerms" type="checkbox" name="agree" syn-datafield="AgreeTerms" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '[필수] 서비스 이용약관', controlText: '서비스 이용약관'}" syn-events="['change']">
                                    </div>
                                </div>
                                <div class="row mb-1">
                                    <div class="col">
                                        <input id="chkAgreePrivacy" type="checkbox" name="agree" syn-datafield="AgreePrivacy" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '[필수] 개인정보 수집 및 이용', controlText: '개인정보 수집 및 이용'}" syn-events="['change']">
                                    </div>
                                </div>
                                <div class="row mb-1">
                                    <div class="col">
                                        <input id="chkAgreeMarketing" type="checkbox" name="agree" syn-datafield="AgreeMarketing" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '[선택] 마케팅 정보 수신'}" syn-events="['change']">
                                    </div>
                                </div>
                                <div class="row mb-1 pl-4">
                                    <div class="col">
                                        <input id="chkMarketingEmail" type="checkbox" syn-datafield="MarketingEmail" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '이메일', disabled: true}">
                                        <input id="chkMarketingSms" type="checkbox" syn-datafield="MarketingSms" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '문자', disabled: true}">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card overflow-auto mb-3">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">메뉴별 권한</h3>
                                <div class="card-actions">
                                    <span id="spnPermissionCount" class="mr-2">선택된 권한 0건</span>
                                </div>
                            </div>
                            <div class="card-body p-2">
                                <table class="table table-sm table-bordered mb-0 text-center">
                                    <thead>
                                        <tr>
                                            <th class="text-start" style="width: 240px;">메뉴</th>
                                            <th><input id="chkColRead" type="checkbox" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '조회'}" syn-events="['change']"></th>
                                            <th><input id="chkColWrite" type="checkbox" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '등록/수정'}" syn-events="['change']"></th>
                                            <th><input id="chkColDelete" type="checkbox" syn-options="{toSynControl: true, checkedValue: 'Y', uncheckedValue: 'N', textContent: '삭제'}" syn-events="['change']"></th>
                                            <th style="width: 120px;">전체</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="text-start">고객 관리</td>
                                            <td><input id="chkCustomerRead" type="checkbox" class="form-check-input" name="perm_read" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkCustomerWrite" type="checkbox" class="form-check-input" name="perm_write" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkCustomerDelete" type="checkbox" class="form-check-input" name="perm_delete" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkRowCustomer" type="checkbox" class="form-check-input" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                        </tr>
                                        <tr>
                                            <td class="text-start">주문 관리</td>
                                            <td><input id="chkOrderRead" type="checkbox" class="form-check-input" name="perm_read" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkOrderWrite" type="checkbox" class="form-check-input" name="perm_write" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkOrderDelete" type="checkbox" class="form-check-input" name="perm_delete" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkRowOrder" type="checkbox" class="form-check-input" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                        </tr>
                                        <tr>
                                            <td class="text-start">상품 관리</td>
                                            <td><input id="chkProductRead" type="checkbox" class="form-check-input" name="perm_read" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkProductWrite" type="checkbox" class="form-check-input" name="perm_write" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkProductDelete" type="checkbox" class="form-check-input" name="perm_delete" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkRowProduct" type="checkbox" class="form-check-input" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                        </tr>
                                        <tr>
                                            <td class="text-start">통계/리포트</td>
                                            <td><input id="chkReportRead" type="checkbox" class="form-check-input" name="perm_read" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkReportWrite" type="checkbox" class="form-check-input" name="perm_write" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkReportDelete" type="checkbox" class="form-check-input" name="perm_delete" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                            <td><input id="chkRowReport" type="checkbox" class="form-check-input" syn-events="['change']" syn-options="{checkedValue: 'Y', uncheckedValue: 'N'}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="card overflow-auto">
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">저장 결과 (서버 전송 대신 화면에 표시)</h3>
                            </div>
                            <div class="card-body">
                                <pre id="preResult" class="mb-0">저장 버튼을 누르면 선택한 약관/권한이 JSON 으로 표시됩니다.</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
