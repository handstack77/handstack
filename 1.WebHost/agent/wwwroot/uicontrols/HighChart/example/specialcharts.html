<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart 특수 series
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            특수 series
        </h2>
        <p>
            Highcharts 11.4.8에서 개별 모듈로 제공하는 대표 series를 확인합니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    Funnel·Variable pie
                </h3>
                <syn_chart id="chtFunnelPie" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    X-range·Timeline
                </h3>
                <syn_chart id="chtRangeTimeline" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Wordcloud
                </h3>
                <syn_chart id="chtWordcloud" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Venn
                </h3>
                <syn_chart id="chtVenn" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
