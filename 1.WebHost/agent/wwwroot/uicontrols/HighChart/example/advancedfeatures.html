<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart 고급 기능
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            고급 기능
        </h2>
        <p>
            option을 분석해 More·3D·solid-gauge·drilldown·annotations·styled mode 모듈과 CSS를 지연 로드합니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    Polar·3D
                </h3>
                <syn_chart id="chtPolar3D" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Solid gauge
                </h3>
                <syn_chart id="chtGauge" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Drilldown·Annotations
                </h3>
                <syn_chart id="chtDrilldown" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Styled mode·Accessibility
                </h3>
                <syn_chart id="chtStyled" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
