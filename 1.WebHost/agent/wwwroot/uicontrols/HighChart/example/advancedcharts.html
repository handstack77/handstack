<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>
        HighChart 고급 차트 어댑터
    </title>
</head>
<body style="visibility:hidden">
    <form id="form1">
        <h3>
            Sankey 어댑터와 모듈 자동 로드
        </h3>
        <p>
            원본 행을 링크 데이터로 변환하며 sankey 모듈은 setValue 시 로컬에서 자동 로드됩니다.
        </p>
        <syn_chart id="chtFlow" syn-events="['pointClick','selectionChange','dataBound']"
                   style="width:100%;height:420px" syn-options="{
                dataAdapter: '$advancedcharts.method.sankeyAdapter',
                selectionMode: 'multiple',
                option: { title: { text: '부서 간 업무 흐름' }, series: [] }
            }">
        </syn_chart>
        <input type="button" id="btnShow" value="선택 행 보기" syn-events="['click']">
        <pre id="preResult">

			</pre>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
