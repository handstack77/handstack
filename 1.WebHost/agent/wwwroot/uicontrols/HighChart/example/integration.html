<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart 데이터 운영 API
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            데이터·운영 API
        </h2>
        <p>
            Promise adapter, Row/List, 동적 API, exporting과 개발자가 명시적으로 요청하는 네이티브 선택을 확인합니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    비동기 행 Adapter
                </h3>
                <syn_chart id="chtAsync" class="demo-chart" syn-options="{ selectionMode:'multiple', dataAdapter:'$integration.method.adapter', option:{} }" syn-events="['selectionChange']">
                </syn_chart>
                <div class="demo-actions">
                    <button type="button" id="btnAppend" syn-events="['click']">
                        point 추가
                    </button>
                    <button type="button" id="btnRow" syn-events="['click']">
                        Row
                    </button>
                    <button type="button" id="btnList" syn-events="['click']">
                        List
                    </button>
                </div>
            </section>
            <section class="demo-card">
                <h3>
                    운영·네이티브 API
                </h3>
                <syn_chart id="chtOperations" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
                <div class="demo-actions">
                    <button type="button" id="btnSelectNative" syn-events="['click']">
                        개발자 선택 효과
                    </button>
                    <button type="button" id="btnClearNative" syn-events="['click']">
                        네이티브 선택 해제
                    </button>
                    <button type="button" id="btnCSV" syn-events="['click']">
                        CSV 확인
                    </button>
                    <button type="button" id="btnFullscreen" syn-events="['click']">
                        전체 화면
                    </button>
                </div>
                <pre id="preResult">
버튼 또는 차트 point를 선택하세요.
					</pre>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
