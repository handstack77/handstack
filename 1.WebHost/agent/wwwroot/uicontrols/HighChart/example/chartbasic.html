<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div>
            <div>
                기본 사용법 - 행 데이터를 자동 추론하는 HighChart
            </div>
            <p>
                차트의 point를 선택하면 같은 index의 원본 행을 getValue로 읽을 수 있습니다.
            </p>
            <syn_chart id="chtSales" syn-events="['pointClick','selectionChange','dataBound']" style="width:100%; height:320px" syn-options="{
                selectionMode: 'multiple',
                option: {
                    chart: { type: 'column' },
                    title: { text: '연도별 매출/이익' },
                    yAxis: { title: { text: '백만원' } }
                }
            }">
            </syn_chart>
        </div>
        <hr />
        <div>
            <div>
                기능
            </div>
            <input type="button" id="btnGetValue" value="선택 List 읽기" syn-events="['click']" />
            <input type="button" id="btnSetValue" value="행 데이터 다시 넣기" syn-events="['click']" />
            <input type="button" id="btnClear" value="clear" syn-events="['click']" />
            <input type="button" id="btnToImage" value="PNG 저장" syn-events="['click']" />
        </div>
        <hr />
        <div>
            <div>
                결과 / 이벤트 로그
            </div>
            <pre id="preLog">

				</pre>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
