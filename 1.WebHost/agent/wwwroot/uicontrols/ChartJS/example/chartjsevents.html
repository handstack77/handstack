<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
	</head>
	<body style="visibility: hidden;">
		<form autocomplete="off" id="form1" syn-datafield="MainForm">
			<div>
				<div>
					$chartjs native + HandStack 이벤트 예제
				</div>
				<p>
					Chart.js onClick 콜백과 syn-events의 pointClick/selectionChange를 함께 사용할 수 있습니다.
				</p>
				<syn_chartjs id="chtTrend" syn-events="['pointClick','selectionChange']" style="width:100%; height:320px" syn-options="{
					type: 'line',
					labelID: 'MONTH',
					series: [
						{ columnID: 'VISIT', label: '방문자수', fill: true },
						{ columnID: 'SIGNUP', label: '가입자수', fill: false }
					],
					options: {
						onClick(evt, elements, chart) {
							if (elements.length > 0) {
								var point = elements[0];
								var label = chart.data.labels[point.index];
								var dataset = chart.data.datasets[point.datasetIndex];
								syn.$l.eventLog('chtTrend_onClick', label + ' / ' + dataset.label + ' = ' + dataset.data[point.index]);
							}
						}
					}
				}">
				</syn_chartjs>
			</div>
			<hr />
			<div>
				<div>
					기능
				</div>
				<input type="button" id="btnSetValue" value="setValue" syn-events="['click']" />
				<input type="button" id="btnGetChartControl" value="getChartControl로 제목 바꾸기" syn-events="['click']" />
				<input type="button" id="btnClear" value="clear" syn-events="['click']" />
			</div>
			<hr />
			<div>
				<div>
					결과 / 이벤트 로그
				</div>
				<pre id="preLog">
				</pre>
			</div>
		</form>
		<script src="/js/syn.loader.js"></script>
	</body>
</html>
