<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div>
            <div>
                기본 사용법 - 행 데이터를 자동 추론하는 ChartJS
            </div>
            <p>
                labelID/series를 생략하면 문자열 label과 숫자 dataset을 자동 구성합니다.
            </p>
            <syn_chartjs id="chtChart" syn-datafield="ChartDetail" syn-events="['pointClick','selectionChange','dataBound']" style="width:100%; height:320px" syn-options="{
                type: 'bar',
                selectionMode: 'multiple',
                options: { scales: { y: { beginAtZero: true } } }
            }">
            </syn_chartjs>
        </div>
        <hr />
        <div>
            <div>
                기능
            </div>
            <input type="button" id="btnGetValue" value="선택 List 읽기" syn-events="['click']" />
            <input type="button" id="btnSetValue" value="setValue" syn-events="['click']" />
            <input type="button" id="btnClear" value="clear" syn-events="['click']" />
        </div>
        <hr />
        <div>
            <div>
                결과 / 이벤트 로그
            </div>
            <pre id="preLog">

				</pre>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
