<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        ECharts Multidimensional
    </title>
    <link rel="stylesheet" href="echartsdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            다차원·특수 좌표계
        </h2>
        <p>
            parallel, themeRiver, calendar heatmap과 ECharts 6 matrix coordinate system을 각각 렌더링합니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    Parallel · ThemeRiver
                </h3>
                <syn_echarts id="chtMulti" class="demo-chart tall" syn-options="{ option:{} }">
                </syn_echarts>
            </section>
            <section class="demo-card">
                <h3>
                    Calendar · Matrix
                </h3>
                <syn_echarts id="chtMatrix" class="demo-chart tall" syn-options="{ option:{} }">
                </syn_echarts>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
