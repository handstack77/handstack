<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Guide - 주문 화면 사용 안내(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">주문 관리 / 주문 현황</div>
                                <h2 class="page-title">주문 현황</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnGuide" class="btn" syn-events="['click']"><i class="f:20 ti ti-help-circle mr-2"></i> 사용법</button>
                                    <button type="button" id="btnReset" class="btn" syn-events="['click']"><i class="f:20 ti ti-refresh mr-2"></i> 안내 다시 보기 설정</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid">
                        <div class="card mb-3" id="cardSearch">
                            <div class="card-body p-2">
                                <div class="row">
                                    <div class="col-4 pl-0">
                                        <div class="input-group">
                                            <label class="w:100 col-form-label px-2">검색어</label>
                                            <input id="txtKeyword" type="text" class="form-control">
                                        </div>
                                    </div>
                                    <div class="col-3 pl-0">
                                        <div class="input-group">
                                            <label class="w:100 col-form-label px-2">상태</label>
                                            <select id="ddlStatus" class="form-select">
                                                <option value="">전체</option>
                                                <option value="WAIT">접수 대기</option>
                                                <option value="DONE">처리 완료</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-auto pl-0">
                                        <button type="button" id="btnSearch" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-search mr-2"></i> 조회</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card overflow-auto" id="cardList">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">주문 목록</h3>
                                <div class="card-actions"><span id="spnCount" class="badge bg-primary mr-2">0건</span></div>
                            </div>
                            <div class="card-body p-2">
                                <table class="table table-sm table-hover mb-0">
                                    <thead><tr><th>주문번호</th><th>고객명</th><th>상품</th><th>상태</th></tr></thead>
                                    <tbody id="tbodyOrders"></tbody>
                                </table>
                            </div>
                        </div>
                        <pre id="preLog" class="mt-3 text-muted" style="max-height: 120px; overflow: auto;"></pre>

                        <syn_guide id="hlpOrder" syn-options="{
                            items: [
                                { helpType: 'I', selector: '#cardSearch', subject: '1. 조회 조건', sentence: '검색어와 상태를 입력해 주문을 찾습니다.', sortingNo: 1 },
                                { helpType: 'I', selector: '#btnSearch', subject: '2. 조회', sentence: '조건을 입력한 뒤 눌러 목록을 새로 불러옵니다.', sortingNo: 2 },
                                { helpType: 'I', selector: '#cardList', subject: '3. 주문 목록', sentence: '조회된 주문이 표시됩니다. 오른쪽 위 배지는 총 건수입니다.', sortingNo: 3 },
                                { helpType: 'T', selector: '#spnCount', subject: '조회 건수', sentence: '조건에 맞는 주문의 건수입니다.' },
                                { helpType: 'P', selector: '#txtKeyword', subject: '검색어', sentence: ['주문번호 또는 고객명', '예: O-1002', '예: 김민준'] },
                                { helpType: 'U', subject: '주문 현황 도움말', sentence: '<p>상태가 <b>접수 대기</b>인 주문은 담당자가 확인한 뒤 처리 완료로 바뀝니다.</p>', options: '{&quot;contentType&quot;: &quot;html&quot;}' }
                            ]
                        }" syn-events="['complete', 'exit']"></syn_guide>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
