<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        NaverMap 기본 예제
    </title>
    <link rel="stylesheet" href="navermapdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1" syn-datafield="MainForm">
        <div class="demo-card">
            <div class="demo-nav">
                <a href="index.html">
                    ← 예제 목록
                </a>
            </div>
            <h3>
                기본 지도와 단일 POI
            </h3>
            <syn_navermap id="mapBasic" class="demo-map" syn-datafield="Place" syn-events="['click','poiClick','selectionChange','error']"
                          syn-options="{ fitBoundsOnData:true, mapOptions:{center:{lat:37.5665,lng:126.978},zoom:13,zoomControl:true,mapTypeControl:true} }">
            </syn_navermap>
            <div class="demo-actions">
                <input type="button" id="btnCityHall" value="서울시청으로 이동" syn-events="['click']">
                <input type="button" id="btnZoom" value="확대" syn-events="['click']">
                <input type="button" id="btnValue" value="선택 값" syn-events="['click']">
            </div>
            <pre id="preResult">
마커를 선택하세요.
				</pre>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
