<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>OrganizationView - 조직 개편 화면(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">조직 관리 / 조직 개편</div>
                                <h2 class="page-title">조직 개편</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnReset" class="btn" syn-events="['click']"><i class="f:20 ti ti-arrow-back-up mr-2"></i> 되돌리기</button>
                                    <button type="button" id="btnSave" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-device-floppy mr-2"></i> 개편안 저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-9">
                                <div class="card overflow-auto mb-3">
                                    <div class="card-status-top bg-dark-overlay"></div>
                                    <div class="card-header p-2 bg-primary-lt">
                                        <h3 class="card-title">조직도</h3>
                                        <div class="card-actions"><span class="mr-2 text-muted">노드를 드래그해 다른 조직 밑으로 옮기거나, 우클릭 메뉴를 사용하세요.</span></div>
                                    </div>
                                    <div class="card-body p-2">
                                        <syn_organization id="orgChart" syn-options="{
                                            height: '460px',
                                            itemID: 'id',
                                            draggable: true,
                                            pan: true,
                                            zoom: true,
                                            nodeTemplate: '$this.event.orgChart_nodeTemplate'
                                        }" syn-events="['nodedrop', 'select']"></syn_organization>
                                        <syn_contextmenu id="ctxOrg" syn-options="{
                                            target: '#orgChart',
                                            delegate: 'div.node',
                                            menu: [
                                                { title: '구성원 보기', cmd: 'members' },
                                                { title: '---' },
                                                { title: '하위 조직 추가', cmd: 'addChild' },
                                                { title: '같은 레벨에 조직 추가', cmd: 'addSibling' },
                                                { title: '---' },
                                                { title: '조직 삭제', cmd: 'remove', uiIcon: 'ui-icon-trash' }
                                            ]
                                        }" syn-events="['beforeOpen', 'select']"></syn_contextmenu>
                                    </div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="card overflow-auto mb-3">
                                    <div class="card-status-top bg-dark-overlay"></div>
                                    <div class="card-header p-2 bg-primary-lt">
                                        <h3 class="card-title">선택 조직</h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-2"><span class="text-muted">조직명</span><div id="divName" class="fw-bold">-</div></div>
                                        <div class="mb-2"><span class="text-muted">조직 코드</span><div id="divCode" class="fw-bold">-</div></div>
                                        <div class="mb-2"><span class="text-muted">하위 조직</span><div id="divChildren" class="fw-bold">-</div></div>
                                        <hr>
                                        <div class="mb-2">
                                            <label class="form-label">추가할 조직명</label>
                                            <input id="txtNewName" type="text" class="form-control" maxlengthB="40" syn-options="{editType: 'text', controlText: '조직명'}">
                                        </div>
                                        <button type="button" id="btnAddChild" class="btn btn-sm" syn-events="['click']">선택 조직 아래에 추가</button>
                                    </div>
                                </div>
                                <div class="card overflow-auto">
                                    <div class="card-header p-2 bg-primary-lt">
                                        <h3 class="card-title">변경 내역</h3>
                                        <div class="card-actions"><span id="spnChanged" class="mr-2">0건</span></div>
                                    </div>
                                    <div class="card-body">
                                        <pre id="preChanges" class="mb-0" style="max-height: 200px; overflow: auto;">변경 내역이 없습니다.</pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
