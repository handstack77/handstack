<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GridList - 전체 기능 확인</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <h3>GridList 전체 기능 확인</h3>
        <p>
            읽기 전용 목록 그리드입니다. 컬럼별 검색(<code>searching</code>), 정렬(<code>ordering</code>/<code>order</code>), 페이징(<code>paging</code>/<code>pageLength</code>/<code>info</code>),
            체크박스 다중 선택(<code>checkbox</code>), <code>getValue</code>/<code>setValue</code>/<code>clear</code>/<code>setCellData</code>/<code>propToCol</code>/<code>getControl</code>,
            이벤트(<code>select</code>/<code>deselect</code>/<code>dblclick</code>)를 확인합니다.
        </p>

        <h4>1. 컬럼 검색 / 정렬 / 페이징 (연봉 내림차순)</h4>
        <syn_list id="lstMain" syn-options="{
            pageLength: 5,
            searching: true,
            ordering: true,
            order: [[3, 'desc']],
            info: true,
            columns: [
                { title: '번호', data: 'id', width: '60px' },
                { title: '이름', data: 'name', width: '120px' },
                { title: '부서', data: 'department', width: '120px' },
                { title: '연봉(만원)', data: 'salary', width: '120px', className: 'text-end' },
                { title: '입사일', data: 'hireDate', width: '110px' }
            ]
        }" syn-events="['select', 'deselect', 'dblclick']" style="width: 100%; border: 1px solid #ccc;"></syn_list>

        <h4 class="mt-3">2. 체크박스 다중 선택 (checkbox: true)</h4>
        <syn_list id="lstCheck" syn-options="{
            checkbox: true,
            searching: false,
            pageLength: 5,
            columns: [
                { title: '', data: 'id', width: '30px' },
                { title: '이름', data: 'name', width: '120px' },
                { title: '부서', data: 'department', width: '120px' }
            ]
        }" style="width: 100%; border: 1px solid #ccc;"></syn_list>

        <h4 class="mt-3">3. 메서드</h4>
        <div class="mb-2">
            <input type="button" id="btnLoad" value="setValue (12건 채우기)" syn-events="['click']">
            <input type="button" id="btnGetValue" value="getValue (전체 행)" syn-events="['click']">
            <input type="button" id="btnClear" value="clear" syn-events="['click']">
            <input type="button" id="btnSum" value="getValue 로 연봉 합계 계산" syn-events="['click']">
            <input type="button" id="btnSetCell" value="setCellData (첫 행 연봉 +500)" syn-events="['click']">
            <input type="button" id="btnPropToCol" value="propToCol ('salary')" syn-events="['click']">
            <input type="button" id="btnChecked" value="체크된 행 조회" syn-events="['click']">
            <input type="button" id="btnDtSearch" value="DataTables API: 부서 검색('개발')" syn-events="['click']">
            <input type="button" id="btnDtPage" value="DataTables API: 다음 페이지" syn-events="['click']">
        </div>
        <pre id="preLog" class="p-2 border" style="max-height: 160px; overflow: auto;">(결과)</pre>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
