<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Calendar - 팀 일정 관리 화면(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">업무 관리 / 팀 일정</div>
                                <h2 class="page-title">팀 일정 관리</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnSaveAll" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-device-floppy mr-2"></i> 변경분 저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-8">
                                <div class="card overflow-auto mb-3">
                                    <div class="card-status-top bg-dark-overlay"></div>
                                    <div class="card-header p-2 bg-primary-lt">
                                        <h3 class="card-title">일정 달력</h3>
                                        <div class="card-actions">
                                            <label class="form-check form-check-inline m-0 pr-2"><input class="form-check-input" type="checkbox" id="chkTeamSales" checked syn-events="['change']"><span class="form-check-label ml--1">영업팀</span></label>
                                            <label class="form-check form-check-inline m-0 pr-2"><input class="form-check-input" type="checkbox" id="chkTeamDev" checked syn-events="['change']"><span class="form-check-label ml--1">개발팀</span></label>
                                            <label class="form-check form-check-inline m-0 pr-2"><input class="form-check-input" type="checkbox" id="chkTeamDesign" checked syn-events="['change']"><span class="form-check-label ml--1">디자인팀</span></label>
                                        </div>
                                    </div>
                                    <div class="card-body p-2">
                                        <syn_calendar id="calTeam" syn-options="{
                                            height: 560,
                                            initialView: 'dayGridMonth',
                                            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek' },
                                            selectable: true,
                                            editable: true,
                                            dayMaxEvents: 3,
                                            eventMapping: { id: 'ScheduleID', title: 'Title', start: 'StartDate', end: 'EndDate', backgroundColor: 'BackgroundColor', allDay: 'AllDay' }
                                        }" syn-events="['eventClick', 'dateClick', 'select', 'eventDrop', 'eventResize', 'datesSet']"></syn_calendar>
                                    </div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="card overflow-auto mb-3">
                                    <div class="card-status-top bg-dark-overlay"></div>
                                    <div class="card-header p-2 bg-primary-lt">
                                        <h3 class="card-title">일정 등록</h3>
                                        <div class="card-actions">
                                            <span id="spnMode" class="mr-2">신규</span>
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-2">
                                            <label class="form-label required">제목</label>
                                            <input id="txtTitle" type="text" class="form-control" maxlengthB="60" syn-options="{editType: 'text', controlText: '제목'}">
                                        </div>
                                        <div class="mb-2">
                                            <label class="form-label">담당 팀</label>
                                            <select id="ddlTeam" class="form-select">
                                                <option value="SALES">영업팀</option>
                                                <option value="DEV">개발팀</option>
                                                <option value="DESIGN">디자인팀</option>
                                            </select>
                                        </div>
                                        <div class="mb-2">
                                            <label class="form-label required">기간</label>
                                            <div>
                                                <syn_datepicker id="dtpStart" syn-options="{useRangeSelect: true, rangeEndControlID: 'dtpEnd', controlText: '시작일'}"></syn_datepicker>
                                            </div>
                                            <div class="mt-1">
                                                <syn_datepicker id="dtpEnd" syn-options="{useRangeSelect: true, rangeStartControlID: 'dtpStart', controlText: '종료일'}"></syn_datepicker>
                                            </div>
                                        </div>
                                        <div class="mb-2">
                                            <label class="form-label">메모</label>
                                            <input id="txtMemo" type="text" class="form-control" maxlengthB="100" syn-options="{editType: 'text'}">
                                        </div>
                                        <div class="btn-list">
                                            <button type="button" id="btnNew" class="btn" syn-events="['click']">신규</button>
                                            <button type="button" id="btnSave" class="btn btn-primary" syn-events="['click']">적용</button>
                                            <button type="button" id="btnDelete" class="btn btn-danger" syn-events="['click']" disabled>삭제</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="card overflow-auto">
                                    <div class="card-header p-2 bg-primary-lt">
                                        <h3 class="card-title">저장 대상 (변경분)</h3>
                                        <div class="card-actions">
                                            <span id="spnChanged" class="mr-2">0건</span>
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <pre id="preChanged" class="mb-0" style="max-height: 180px; overflow: auto;">변경된 일정이 없습니다.</pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script>
        function pageLoadFiles(styleFiles, jsFiles, templateFiles) {
            window.afterLoadFiles = [];
            // syn.loader.js 에는 'calendar' 자동 매핑 항목이 없으므로 직접 등록합니다.
            afterLoadFiles.push('/lib/fullcalendar/index.global.min.js');
            afterLoadFiles.push('/lib/fullcalendar/core/locales/ko.global.min.js');
            afterLoadFiles.push('/uicontrols/Calendar/Calendar.css');
            afterLoadFiles.push('/uicontrols/Calendar/Calendar.js');
        }
    </script>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
