<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>CodePicker - 주문 입력 화면(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">주문 관리 / 주문 입력</div>
                                <h2 class="page-title">주문 입력</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnSample" class="btn" syn-events="['click']"><i class="f:20 ti ti-wand mr-2"></i> 예제용 값 선택</button>
                                    <button type="button" id="btnNew" class="btn" syn-events="['click']"><i class="f:20 ti ti-file-plus mr-2"></i> 신규</button>
                                    <button type="button" id="btnSave" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-device-floppy mr-2"></i> 저장</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid max-width:1000!">
                        <div class="alert alert-info mb-3">
                            돋보기 팝업은 서버에 <code>CHP_CUSTOMER</code>, <code>CHP_MANAGER</code>, <code>CHP_PRODUCT</code> 데이터소스가 등록된 환경에서 동작합니다.
                            서버가 없는 환경에서는 "예제용 값 선택" 버튼으로 팝업 선택 결과를 흉내 낼 수 있습니다.
                        </div>
                        <div class="card overflow-auto mb-3">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">주문 정보</h3>
                            </div>
                            <div class="card-body">
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label required">고객</label>
                                    <div class="col">
                                        <syn_codepicker id="chpCustomer" syn-datafield="CustomerID" syn-events="['change']" syn-options="{dataSourceID: 'CHP_CUSTOMER', local: false, isMultiSelect: false, codeElementClass: 'hidden', textDataFieldID: 'CustomerName', controlText: '고객'}"></syn_codepicker>
                                    </div>
                                    <label class="col-2 col-form-label required">담당 직원</label>
                                    <div class="col">
                                        <syn_codepicker id="chpManager" syn-datafield="ManagerID" syn-events="['change']" syn-options="{dataSourceID: 'CHP_MANAGER', local: false, isMultiSelect: false, codeElementClass: 'hidden', textDataFieldID: 'ManagerName', parameters: '@CustomerID:;', controlText: '담당 직원'}"></syn_codepicker>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label required">주문 상품</label>
                                    <div class="col">
                                        <syn_codepicker id="chpProduct" syn-datafield="ProductIDs" syn-events="['change']" syn-options="{dataSourceID: 'CHP_PRODUCT', local: false, isMultiSelect: true, textDataFieldID: 'ProductNames', controlText: '주문 상품'}"></syn_codepicker>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label">주문 메모</label>
                                    <div class="col">
                                        <input id="txtMemo" type="text" class="form-control" maxlengthB="200" syn-options="{editType: 'text'}">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card overflow-auto">
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">저장 결과 (서버 전송 대신 화면에 표시)</h3>
                            </div>
                            <div class="card-body">
                                <pre id="preResult" class="mb-0">저장 버튼을 누르면 선택한 값이 JSON 으로 표시됩니다.</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script>
        // CodePicker 는 내부 입력창을 TextBox 컨트롤로 만들기 때문에, 페이지에 TextBox 가 없으면 필요한 파일을 직접 추가한다.
        function pageLoadFiles(jsFiles, styleFiles, templateFiles) {
            styleFiles.push('/uicontrols/TextBox/TextBox.css');
            jsFiles.push('/lib/vanilla-masker/vanilla-masker.min.js');
            jsFiles.push('/uicontrols/TextBox/TextBox.js');
        }
    </script>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
