<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>DropDownCheckList - 상품 다중 조건 조회(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">상품 관리 / 상품 현황</div>
                                <h2 class="page-title">상품 현황 조회</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnReset" class="btn" syn-events="['click']"><i class="f:20 ti ti-refresh mr-2"></i> 초기화</button>
                                    <button type="button" id="btnSearch" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-search mr-2"></i> 조회</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid">
                        <div class="card mb-3">
                            <div class="card-body p-2">
                                <div class="row">
                                    <div class="col-4 pl-0">
                                        <div class="input-group">
                                            <label class="w:100 col-form-label px-2">상품 분류</label>
                                            <select id="ddlCategory" multiple syn-options="{placeholder: '전체', storeSourceID: 'CATEGORY', local: true, sharedAssetUrl: './', toSynControl: true, width: 220}" syn-events="['change']"></select>
                                        </div>
                                    </div>
                                    <div class="col-4 pl-0">
                                        <div class="input-group">
                                            <label class="w:100 col-form-label px-2">판매 상태</label>
                                            <select id="ddlSaleStatus" multiple syn-options="{placeholder: '전체', toSynControl: true, width: 220}" syn-events="['change']">
                                                <option value="ON">판매 중</option>
                                                <option value="OUT">품절</option>
                                                <option value="STOP">판매 중지</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-4 pl-0">
                                        <div class="input-group">
                                            <label class="w:100 col-form-label px-2">상품명</label>
                                            <input id="txtProductName" type="text" class="form-control" maxlengthB="60" syn-options="{editType: 'text'}">
                                        </div>
                                    </div>
                                </div>
                                <div class="row mt-2">
                                    <div class="col pl-0">
                                        <span class="px-2 text-muted">선택한 조건: </span><span id="spnCondition">전체</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card overflow-auto">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">상품 목록</h3>
                                <div class="card-actions">
                                    <span id="spnCount" class="mr-2">0건</span>
                                </div>
                            </div>
                            <div class="card-body p-2">
                                <table class="table table-sm table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th style="width: 110px;">상품 코드</th>
                                            <th>상품명</th>
                                            <th>분류</th>
                                            <th>판매 상태</th>
                                            <th class="text-end">가격</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbodyProducts"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
