<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        NaverMap 모니터링 예제
    </title>
    <link rel="stylesheet" href="navermapdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1" syn-datafield="MainForm">
        <div class="demo-card">
            <div class="demo-nav">
                <a href="index.html">
                    ← 예제 목록
                </a>
            </div>
            <h3>
                MonitoringMap 방식의 POI
            </h3>
            <p>
                업무 행의
                <code>
                    LAT/LNG/CT_NAME/CT_ADDRESS
                </code>
                와 함수 resolver로 HTML 마커·InfoWindow를 만듭니다.
            </p>
            <syn_navermap id="mapMonitor" class="demo-map" syn-datafield="Assets" syn-events="['poiClick','poiMouseover','poiMouseout','dataBound','error']" syn-options="{fitBoundsOnData:true,mapOptions:{zoom:11,minZoom:6}}">
            </syn_navermap>
            <pre id="preResult">
POI를 클릭하세요.
				</pre>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
