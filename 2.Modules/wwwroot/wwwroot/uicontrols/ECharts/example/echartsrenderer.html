<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        ECharts Renderer
    </title>
    <link rel="stylesheet" href="echartsdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            렌더러·테마·운영 API
        </h2>
        <p>
            Canvas/SVG 재초기화, 사용자 테마·locale, resize, loading과 이미지 data URL을 확인합니다.
        </p>
        <section class="demo-card">
            <syn_echarts id="chtRenderer" class="demo-chart" syn-events="['reinitialized','resized']" syn-options="{ option:{} }">
            </syn_echarts>
            <div class="demo-actions">
                <input id="btnCanvas" type="button" value="Canvas" syn-events="['click']">
                <input id="btnSVG" type="button" value="SVG" syn-events="['click']">
                <input id="btnTheme" type="button" value="Theme" syn-events="['click']">
                <input id="btnResize" type="button" value="Resize" syn-events="['click']">
                <input id="btnLoading" type="button" value="Loading" syn-events="['click']">
                <input id="btnImage" type="button" value="Data URL" syn-events="['click']">
            </div>
            <pre id="preResult">


운영 API를 실행하세요.
				
				
				</pre>
        </section>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
