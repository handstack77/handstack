<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        ECharts Hierarchy
    </title>
    <link rel="stylesheet" href="echartsdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            계층 series
        </h2>
        <p>
            동일한 원본 계층 행을 tree, treemap, sunburst 데이터로 변환하고 선택 Resolver로 행을 되찾습니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    Tree
                </h3>
                <syn_echarts id="chtTree" class="demo-chart" syn-events="['click']" syn-options="{ option:{} }">
                </syn_echarts>
            </section>
            <section class="demo-card">
                <h3>
                    Treemap
                </h3>
                <syn_echarts id="chtTreemap" class="demo-chart" syn-events="['click']" syn-options="{ option:{} }">
                </syn_echarts>
            </section>
            <section class="demo-card">
                <h3>
                    Sunburst
                </h3>
                <syn_echarts id="chtSunburst" class="demo-chart" syn-events="['click']" syn-options="{ option:{} }">
                </syn_echarts>
            </section>
            <section class="demo-card">
                <h3>
                    선택 결과
                </h3>
                <pre id="preResult">

노드를 선택하세요.
					
					</pre>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
