<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>
        ChartJS - Plugins 샘플 갤러리
    </title>
    <style>
        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            margin: 16px;
            color: #222;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        .lead {
            color: #666;
            margin: 0 0 16px;
            font-size: 13px;
        }

        .chart-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
        }

        .chart-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }

            .chart-card h3 {
                margin: 0 0 4px;
                font-size: 14px;
            }

            .chart-card p {
                margin: 0 0 10px;
                font-size: 12px;
                color: #666;
            }

        button {
            font-size: 12px;
            padding: 4px 10px;
        }
    </style>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <h1>
            Plugins
        </h1>
        <p class="lead">
            chartjs.org 공식 샘플(docs/samples/plugins/*) 3종을 &lt;syn_chartjs&gt;로 재현합니다.
            <code>
                setConfig
            </code>
            의
            <code>
                plugins
            </code>
            배열에 인스턴스 전용 plugin 객체를 전달합니다.
        </p>
        <div class="chart-gallery">
            <div class="chart-card">
                <h3>
                    Chart Area Border
                </h3>
                <p>
                    <code>
                        beforeDraw
                    </code>
                    로 chartArea 둘레에 테두리를 그립니다.
                </p>
                <syn_chartjs id="chtAreaBorder" style="width:100%;height:280px">
                </syn_chartjs>
            </div>
            <div class="chart-card">
                <h3>
                    Doughnut Empty State
                </h3>
                <p>
                    데이터가 모두 0이면 회색 안내 링으로 대체해서 그립니다.
                </p>
                <syn_chartjs id="chtEmptyState" style="width:100%;height:280px">
                </syn_chartjs>
                <button type="button" id="btnToggleEmpty" syn-events="['click']">
                    데이터 있음/없음 전환
                </button>
            </div>
            <div class="chart-card">
                <h3>
                    Quadrants
                </h3>
                <p>
                    산점도를 4분면으로 나눠 배경색을 다르게 칠합니다.
                </p>
                <syn_chartjs id="chtQuadrants" style="width:100%;height:280px">
                </syn_chartjs>
            </div>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
