<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>
        ChartJS - Title/Subtitle 샘플 갤러리
    </title>
    <style>
        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            margin: 16px;
            color: #222;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        .lead {
            color: #666;
            margin: 0 0 16px;
            font-size: 13px;
        }

        .chart-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
        }

        .chart-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }

            .chart-card h3 {
                margin: 0 0 4px;
                font-size: 14px;
            }

            .chart-card p {
                margin: 0 0 10px;
                font-size: 12px;
                color: #666;
            }

        .trio {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

            .trio h4 {
                margin: 0 0 2px;
                font-size: 11px;
                text-align: center;
                color: #444;
            }
    </style>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <h1>
            Title / Subtitle
        </h1>
        <p class="lead">
            chartjs.org 공식 샘플(docs/samples/title/*, docs/samples/subtitle/*) 2종을 &lt;syn_chartjs&gt;로 재현합니다.
        </p>
        <div class="chart-gallery">
            <div class="chart-card">
                <h3>
                    Title Alignment
                </h3>
                <p>
                    <code>
                        plugins.title.align
                    </code>
                    3가지(start/center/end)를 비교합니다.
                </p>
                <div class="trio">
                    <div>
                        <h4>
                            start
                        </h4>
                        <syn_chartjs id="chtTitleStart" style="width:100%;height:200px">
                        </syn_chartjs>
                    </div>
                    <div>
                        <h4>
                            center
                        </h4>
                        <syn_chartjs id="chtTitleCenter" style="width:100%;height:200px">
                        </syn_chartjs>
                    </div>
                    <div>
                        <h4>
                            end
                        </h4>
                        <syn_chartjs id="chtTitleEnd" style="width:100%;height:200px">
                        </syn_chartjs>
                    </div>
                </div>
            </div>
            <div class="chart-card">
                <h3>
                    Subtitle
                </h3>
                <p>
                    <code>
                        plugins.subtitle.display/text
                    </code>
                    로 제목 아래 보조 설명을 붙입니다.
                </p>
                <syn_chartjs id="chtSubtitle" style="width:100%;height:280px">
                </syn_chartjs>
            </div>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
