<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>TextArea - 고객 문의 접수 화면(실무형)</title>
</head>
<body style="visibility: hidden;">
    <form autocomplete="off" id="form1" syn-datafield="MainForm">
        <div class="page">
            <div class="page-wrapper">
                <div class="page-header mt-2">
                    <div class="container-fluid">
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <div class="page-pretitle f:12!">고객 지원 / 문의 관리</div>
                                <h2 class="page-title">고객 문의 접수</h2>
                            </div>
                            <div class="col-auto">
                                <div class="btn-list">
                                    <button type="button" id="btnNew" class="btn" syn-events="['click']"><i class="f:20 ti ti-file-plus mr-2"></i> 신규</button>
                                    <button type="button" id="btnSave" class="btn btn-primary" syn-events="['click']"><i class="f:20 ti ti-device-floppy mr-2"></i> 접수</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-body m-3">
                    <div class="container-fluid max-width:1000!">
                        <div class="card overflow-auto mb-3">
                            <div class="card-status-top bg-dark-overlay"></div>
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">문의 내용</h3>
                            </div>
                            <div class="card-body">
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label required">문의 유형</label>
                                    <div class="col align-content-center">
                                        <label class="form-check form-check-inline m-0 pr-2">
                                            <input class="form-check-input" type="radio" id="rdoInquiryType1" name="rdoInquiryType" value="PROD" checked>
                                            <span class="form-check-label ml--1">상품 문의</span>
                                        </label>
                                        <label class="form-check form-check-inline m-0 pr-2">
                                            <input class="form-check-input" type="radio" id="rdoInquiryType2" name="rdoInquiryType" value="DLV">
                                            <span class="form-check-label ml--1">배송 문의</span>
                                        </label>
                                        <label class="form-check form-check-inline m-0 pr-2">
                                            <input class="form-check-input" type="radio" id="rdoInquiryType3" name="rdoInquiryType" value="ETC">
                                            <span class="form-check-label ml--1">기타</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label required">제목</label>
                                    <div class="col">
                                        <input id="txtTitle" type="text" class="form-control" maxlengthB="100" syn-options="{editType: 'text', controlText: '제목'}">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label required">문의 내용</label>
                                    <div class="col">
                                        <textarea id="txtContent" class="form-control" syn-options="{toSynControl: false, controlText: '문의 내용'}" maxlength="500" placeholder="문의 내용을 10자 이상 입력하세요." style="height: 160px;"></textarea>
                                        <div class="d-flex justify-content-between mt-1">
                                            <div>
                                                <button type="button" id="btnTemplate1" class="btn btn-sm" syn-events="['click']">배송 지연 문의 문구</button>
                                                <button type="button" id="btnTemplate2" class="btn btn-sm" syn-events="['click']">교환/환불 문의 문구</button>
                                            </div>
                                            <span id="spnCounter" class="text-muted">0 / 500자 (0 byte)</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label class="col-2 col-form-label">처리 메모(내부용)</label>
                                    <div class="col">
                                        <textarea id="txtMemo" syn-options="{toSynControl: true, lineNumbers: false, width: '100%', height: '90px'}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card overflow-auto">
                            <div class="card-header p-2 bg-primary-lt">
                                <h3 class="card-title">접수 결과 (서버 전송 대신 화면에 표시)</h3>
                            </div>
                            <div class="card-body">
                                <pre id="preResult" class="mb-0">접수 버튼을 누르면 입력 내용이 JSON 으로 표시됩니다.</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/syn.loader.js"></script>
</body>
</html>
