<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart Gantt
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            Highcharts Gantt
        </h2>
        <p>
            작업 계층·의존 관계·현재일·drag/drop option을 원형 Gantt 생성자로 전달합니다.
        </p>
        <section class="demo-card">
            <syn_chart id="chtGantt" class="demo-chart tall" syn-options="{ constructorType:'ganttChart', selectionMode:'multiple', option:{} }" syn-events="['selectionChange','pointDrop']">
            </syn_chart>
            <pre id="preResult">
작업을 클릭하거나 이동하세요.
				</pre>
        </section>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
