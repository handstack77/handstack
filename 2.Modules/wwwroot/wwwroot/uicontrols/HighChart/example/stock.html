<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart Stock
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            Highcharts Stock
        </h2>
        <p>
            OHLC·flags·SMA·navigator·range selector와 Stock Tools 의존성을 로컬에서 로드합니다.
        </p>
        <section class="demo-card">
            <div class="stock-layout">
                <div class="highcharts-stocktools-wrapper">
                </div>
                <syn_chart id="chtStock" class="demo-chart tall" syn-options="{ constructorType:'stockChart', selectionMode:'multiple', option:{} }" syn-events="['selectionChange']">
                </syn_chart>
            </div>
            <pre id="preResult">
가격 point를 클릭하면 원본 행을 표시합니다.
				</pre>
        </section>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
