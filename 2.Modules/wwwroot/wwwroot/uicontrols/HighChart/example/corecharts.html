<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        HighChart Core
    </title>
    <link rel="stylesheet" href="highchartdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <h2>
            Core 차트
        </h2>
        <p>
            표준 series와 Highcharts More의 bubble을 같은 원형 option으로 구성합니다.
        </p>
        <div class="demo-grid">
            <section class="demo-card">
                <h3>
                    Line·Area
                </h3>
                <syn_chart id="chtLineArea" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Column·Pie 조합
                </h3>
                <syn_chart id="chtCombination" class="demo-chart" syn-options="{ option:{} }">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    Scatter·Bubble
                </h3>
                <syn_chart id="chtScatterBubble" class="demo-chart" syn-options="{ selectionMode:'multiple', option:{} }" syn-events="['selectionChange']">
                </syn_chart>
            </section>
            <section class="demo-card">
                <h3>
                    선택 데이터
                </h3>
                <p>
                    클릭은 Row/List 상태만 바꾸며 자동 포커스는 그리지 않습니다.
                </p>
                <div class="demo-actions">
                    <button type="button" id="btnCoreRow" syn-events="['click']">
                        Row
                    </button>
                    <button type="button" id="btnCoreList" syn-events="['click']">
                        List
                    </button>
                </div>
                <pre id="preResult">
Bubble point를 클릭하세요.
					</pre>
            </section>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
