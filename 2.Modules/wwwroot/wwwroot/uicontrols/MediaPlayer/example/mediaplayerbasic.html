<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        MediaPlayer 기본 예제
    </title>
    <link rel="stylesheet" href="mediaplayerdemo.css">
</head>
<body style="visibility:hidden">
    <form id="form1" syn-datafield="MainForm">
        <div class="demo-nav">
            <a href="index.html">
                ← 예제 목록
            </a>
        </div>
        <div class="demo-card">
            <h3>
                단일 객체와 기본 제어
            </h3>
            <p>
                <code>
                    setValue({})
                </code>
                로 비디오 한 건을 바인딩합니다.
            </p>
            <syn_mediaplayer id="mpBasic" class="demo-player" syn-datafield="Media"
                             syn-events="['play','pause','ended','mediaChange','historyChange']"
                             syn-options="{ playlist:{visible:false}, completionThreshold:0.9 }">
            </syn_mediaplayer>
            <div class="demo-actions">
                <input type="button" id="btnPlay" value="play" syn-events="['click']">
                <input type="button" id="btnPause" value="pause" syn-events="['click']">
                <input type="button" id="btnBack" value="-10초" syn-events="['click']">
                <input type="button" id="btnForward" value="+10초" syn-events="['click']">
                <input type="button" id="btnMute" value="mute 전환" syn-events="['click']">
                <input type="button" id="btnState" value="상태" syn-events="['click']">
            </div>
            <pre id="preResult">
플레이어를 조작하면 상태가 표시됩니다.
				</pre>
        </div>
    </form>
    <script src="/js/syn.loader.js"></script>
</body>
</html>
