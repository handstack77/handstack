    <script id="tplFavoriteItem" type="text/x-mustache">
		{{#favoriteGroups}}
		<div data-favorite-group="{{FavoriteGroupID}}" class="accordion-item">
			<div class="accordion-header">
				<div class="accordion-button" onclick="$this.event.btnToggleFavoriteMenu_click(event, '{{FavoriteGroupID}}')">
					<div class="accordion-button-toggle accordion-button-toggle-plus">
						<i class="ti ti-chevron-up"></i>
					</div>
					{{FavoriteGroupName}}
					<div class="accordion-button-icon h:20 mr-2 absolute right-0" onclick="$this.event.btnEditFavoriteMenu_click(event, '{{FavoriteGroupID}}')">
						<i class="ti ti-edit"></i>
					</div>
				</div>
			</div>
			<div class="accordion-collapse collapse">
				<div class="accordion-body">
					<ul class="navbar-nav">
						{{#FavoriteMenuItems}}
						<li class="nav-item dropdown" onclick="$this.event.liFavoriteMenu_click(event, '{{DirectoryID}}', '{{ItemID}}')">
							<div class="nav-link">
								<span class="f:12 nav-link-title">{{ParentMenuName}}</span>
							</div>
							<div class="margin-left:32 mt--4 nav-link p-0">{{MenuName}}</div>
						</li>
						{{/FavoriteMenuItems}}
					</ul>
				</div>
			</div>
		</div>
		{{/favoriteGroups}}
    </script>
    <script id="tplHistoryMenuItem" type="text/x-mustache">
		{{#historyMenus}}
		<div class="nav-item dropdown" onclick="$this.event.liFavoriteMenu_click(event, '{{DirectoryID}}', '{{ItemID}}')">
			<div class="nav-link">
				<span class="mr-2 f:12">
					{{MenuOpenTime}}
				</span>
				<span class="f:12 nav-link-title">{{ParentMenuName}}</span>
			</div>
			<div class="margin-left:32 mt--4 nav-link p-0">{{MenuName}}</div>
		</div>
		{{/historyMenus}}
    </script>
